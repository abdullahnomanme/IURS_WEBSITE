<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>IURS Member Dashboard</title><link rel="stylesheet" href="assets/iurs-polish.css"><style>body{margin:0;background:#f7f4ef;color:#172033;font-family:Inter,system-ui,sans-serif}.dash-nav{background:#091425;color:#fff;padding:14px 22px;display:flex;justify-content:space-between;align-items:center;gap:15px}.dash-nav .brand{display:flex;align-items:center;gap:10px}.dash-nav img{width:38px;height:38px;border-radius:9px}.dash-nav strong{font-family:'Source Serif 4',Georgia,serif;font-size:20px}.logout{border:1px solid rgba(255,255,255,.3);background:transparent;color:#fff;border-radius:8px;padding:9px 12px;cursor:pointer}.wrap{max-width:1120px;margin:0 auto;padding:28px 18px}.hero-card,.card{background:#fff;border:1px solid #e8e6e2;border-radius:18px;box-shadow:0 8px 30px rgba(15,23,42,.06)}.hero-card{padding:28px;margin-bottom:18px}.hero-card h1{font:800 32px 'Source Serif 4',Georgia,serif;margin:0 0 6px}.muted{color:#6b7280}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.card{padding:22px}.card h3{margin:0 0 14px;font:800 22px 'Source Serif 4',Georgia,serif}.row{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid #eef1f4;gap:15px}.row:last-child{border-bottom:0}.badge{display:inline-flex;padding:5px 9px;border-radius:999px;background:#f8e9ee;color:#9b0b2b;font-weight:800;font-size:11px}.link{color:#9b0b2b;font-weight:800;text-decoration:none}@media(max-width:700px){.grid{grid-template-columns:1fr}.hero-card h1{font-size:27px}.dash-nav{padding:12px 14px}}
</style>
<meta name="robots" content="noindex,nofollow">
<meta name="description" content="IURS member dashboard.">
<link rel="canonical" data-abs="/dashboard.html" href="/dashboard.html">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Islamic University Research Society">
<meta property="og:title" content="IURS Member Dashboard">
<meta property="og:description" content="IURS member dashboard.">
<meta property="og:url" data-abs="/dashboard.html" content="/dashboard.html">
<meta property="og:image" data-abs="/assets/logo-iurs.webp" content="/assets/logo-iurs.webp">
<meta name="twitter:card" content="summary">
</head><body><header class="dash-nav"><div class="brand"><img decoding="async" width="512" height="512" src="assets/logo-iurs.webp" alt="IURS"><strong>Member Space</strong></div><button class="logout" id="logout">Logout</button></header><main class="wrap"><section class="hero-card"><div class="badge">IURS MEMBER</div><h1 id="name">Loading…</h1><p class="muted" id="idline"></p></section><div class="grid"><section class="card"><h3>My Profile</h3><div id="profile"></div></section><section class="card"><h3>My Research &amp; Activities</h3><div class="row"><span>Research profile</span><a class="link" href="publications.html">Browse publications →</a></div><div class="row"><span>Training &amp; sessions</span><a class="link" href="training-session.html">View programmes →</a></div><div class="row"><span>Events</span><a class="link" href="events.html">View events →</a></div><div class="row"><span>Gallery</span><a class="link" href="gallery.html">View gallery →</a></div></section></div><section class="card" style="margin-top:16px"><h3>Security</h3><form id="passForm" style="display:grid;gap:10px;max-width:520px"><input id="oldpw" type="password" minlength="10" placeholder="Current password" required style="padding:10px;border:1px solid #ddd;border-radius:8px"><input id="newpw" type="password" minlength="10" placeholder="New password (10+ characters)" required style="padding:10px;border:1px solid #ddd;border-radius:8px"><button class="logout" type="submit" style="background:#960b27;border-color:#960b27;width:max-content">Change Password</button><span id="passMsg" class="muted"></span></form></section></main><script>
(async()=>{const r=await fetch('/api/auth/me');const d=await r.json();if(!d.authenticated||d.user.role!=='member'){location.href='login.html';return}const u=d.user;document.getElementById('name').textContent=u.name;document.getElementById('idline').textContent=u.iurs_id+' · '+(u.position||'Member');document.getElementById('profile').innerHTML=[['Department',u.department||'—'],['Year',u.year_level||'—'],['Email',u.email||'—'],['Phone',u.phone||'—'],['Status',u.status||'—']].map(x=>`<div class="row"><strong>${x[0]}</strong><span>${x[1]}</span></div>`).join('');})();document.getElementById('passForm').onsubmit=async e=>{e.preventDefault();const r=await fetch('/api/auth/change-password',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({currentPassword:oldpw.value,newPassword:newpw.value})});const d=await r.json();passMsg.textContent=r.ok?'Password changed successfully.':(d.error||'Could not change password.');if(r.ok)e.target.reset()};document.getElementById('logout').onclick=async()=>{await fetch('/api/auth/logout',{method:'POST'});location.href='login.html'};</script></body></html>
