<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Event Details | IURS</title>
<meta name="description" content="Event details, schedule and registration information from Islamic University Research Society.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Playfair+Display:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
:root{--red:#a4112f;--navy:#0b1b31;--cream:#f7f5f0;--ink:#172033;--muted:#667085;--line:#e8e5df}*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font-family:Inter,system-ui,sans-serif}a{color:inherit}.site-nav{height:76px;background:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 max(5vw,24px);box-shadow:0 5px 25px #1018280b}.brand{display:flex;align-items:center;gap:12px;text-decoration:none;font-weight:800;color:var(--navy)}.brand img{width:48px;height:48px;object-fit:contain}.brand span small{display:block;font-size:10px;letter-spacing:.08em;color:var(--muted);font-weight:600}.back{color:var(--red);font-weight:700;text-decoration:none}.hero{background:linear-gradient(120deg,#071426ed,#071426a8),url('assets/campus-hero.jpg') center/cover;color:#fff;padding:42px max(5vw,24px) 48px}.crumb{font-size:13px;color:#ffffffb8;margin-bottom:24px}.crumb a{color:#fff}.hero h1{font:700 clamp(30px,4.5vw,54px)/1.15 'Playfair Display',serif;max-width:900px;margin:0 0 15px}.hero p{max-width:780px;line-height:1.8;color:#ffffffd9;margin:0}.wrap{max-width:1280px;margin:42px auto 80px;padding:0 24px;display:grid;grid-template-columns:minmax(0,1.7fr) minmax(280px,.8fr);gap:30px;align-items:start}.main-card,.side-card{background:#fff;border:1px solid #eeece7;border-radius:22px;overflow:hidden;box-shadow:0 14px 45px #1720330b}.cover{aspect-ratio:16/8.5;background:linear-gradient(135deg,#152b46,#a4112f);display:grid;place-items:center;color:#ffffff70;font-size:42px}.cover img{width:100%;height:100%;object-fit:cover;display:block}.content{padding:30px}.eyebrow{color:var(--red);font-weight:800;font-size:12px;letter-spacing:.1em;text-transform:uppercase}.content h2,.side-card h2{font:700 27px/1.3 'Playfair Display',serif;margin:10px 0 18px}.description{font-size:16px;line-height:1.9;color:#475467;white-space:pre-line;overflow-wrap:anywhere}.meta{display:grid;gap:18px;padding:26px}.meta-row{display:flex;gap:14px;align-items:flex-start;color:#475467;line-height:1.5}.meta-row i{width:22px;color:var(--red);padding-top:3px}.meta-row strong{display:block;color:var(--ink);font-size:12px;text-transform:uppercase;letter-spacing:.06em;margin-bottom:4px}.cta{display:flex;flex-direction:column;gap:10px;padding:0 26px 26px}.btn{display:flex;justify-content:center;align-items:center;gap:9px;border-radius:999px;padding:15px 18px;background:var(--red);color:#fff;text-decoration:none;font-weight:800;border:0;cursor:pointer}.btn.secondary{background:#fff;color:var(--red);border:1px solid #ead1d7}.side-card h2{padding:24px 26px 0;margin-bottom:0;font-size:23px}.venue-note{padding:18px 26px 26px;color:var(--muted);line-height:1.7;font-size:14px}.loading{min-height:60vh;display:grid;place-items:center}.load-inner{text-align:center;color:var(--muted)}.loader-logo{width:82px;height:82px;border-radius:50%;background:#fff;border:1px solid #eee;display:grid;place-items:center;margin:0 auto 20px;box-shadow:0 0 0 7px #a4112f0d;animation:breathe 1.6s ease-in-out infinite}.loader-logo img{width:48px;height:48px;object-fit:contain}.spinner{width:34px;height:34px;border:3px solid #ead9de;border-top-color:var(--red);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 18px}@keyframes spin{to{transform:rotate(360deg)}}@keyframes breathe{50%{transform:scale(1.06);box-shadow:0 0 0 12px #a4112f08}}.error{max-width:680px;margin:70px auto;padding:30px;text-align:center;background:#fff;border-radius:18px}.footer{padding:28px;text-align:center;background:var(--navy);color:#ffffffa8;font-size:13px}@media(max-width:820px){.wrap{grid-template-columns:1fr;margin-top:24px}.hero{padding-top:30px}.content{padding:22px}.cover{aspect-ratio:16/9}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;animation-iteration-count:1!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<nav class="site-nav"><a class="brand" href="index.html"><img src="assets/logo-iurs.webp" alt="IURS logo"><span>Islamic University Research Society<small>IURS · RESEARCH FOR A BETTER WORLD</small></span></a><a class="back" href="events.html"><i class="fa-solid fa-arrow-left"></i> All Events</a></nav>
<header class="hero"><div class="crumb"><a href="index.html">Home</a> &nbsp;›&nbsp; <a href="events.html">Events</a> &nbsp;›&nbsp; Details</div><h1 id="event-title">Event Details</h1><p id="event-intro">Event information and registration details.</p></header>
<main id="event-root" class="loading" aria-live="polite"><div class="load-inner"><div class="loader-logo"><img src="assets/logo-iurs.webp" alt=""></div><div class="spinner"></div><strong>Loading event details…</strong></div></main>
<footer class="footer">© <span id="year"></span> Islamic University Research Society · Islamic University, Kushtia</footer>
<script>
(()=>{const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c])),fmt=d=>{if(!d)return 'To be announced';const x=new Date(d+'T00:00:00');return Number.isNaN(x.getTime())?'To be announced':x.toLocaleDateString('en-GB',{day:'numeric',month:'long',year:'numeric'})},safeUrl=v=>{try{const u=new URL(String(v||''),location.href);return ['http:','https:'].includes(u.protocol)?u.href:''}catch{return ''}};$('year').textContent=new Date().getFullYear();const id=new URLSearchParams(location.search).get('id');const root=$('event-root');if(!id||!/^\d+$/.test(id)){root.className='';root.innerHTML='<section class="error"><h2>Choose an event to view its details</h2><p>Open an event from the IURS events page.</p><a class="btn" href="events.html">Browse Events</a></section>';return}
fetch('/api/public/events',{headers:{accept:'application/json'}}).then(r=>{if(!r.ok)throw Error('Could not load events');return r.json()}).then(data=>{const rows=Array.isArray(data)?data:[],e=rows.find(x=>String(x.id)===id);if(!e)throw Error('This event could not be found. It may have been removed.');const title=esc(e.title||'IURS Event'),image=safeUrl(e.image_url),reg=safeUrl(e.registration_url),more=safeUrl(e.link_url);document.title=(e.title||'Event Details')+' | IURS';$('event-title').textContent=e.title||'Event Details';$('event-intro').textContent=(e.status==='cancelled'?'This event has been cancelled. ': '')+(e.venue||'Islamic University, Kushtia');const status=e.status_override||(e.status||'');const rootMarkup='<div class="wrap"><article class="main-card"><div class="cover">'+(image?'<img src="'+esc(image)+'" alt="'+title+'" onerror="this.remove()">':'<i class="fa-regular fa-calendar-check" aria-hidden="true"></i>')+'</div><div class="content"><div class="eyebrow">'+esc(status==='cancelled'?'Cancelled':status==='past'?'Past Event':'IURS Event')+'</div><h2>'+title+'</h2><div class="description">'+esc(e.description||'Full event information will be announced by IURS.')+'</div></div></article><aside><section class="side-card"><h2>Event Information</h2><div class="meta"><div class="meta-row"><i class="fa-regular fa-calendar"></i><div><strong>Date</strong>'+esc(fmt(e.event_date))+'</div></div><div class="meta-row"><i class="fa-regular fa-clock"></i><div><strong>Time</strong>'+esc(e.event_time||'To be announced')+'</div></div><div class="meta-row"><i class="fa-solid fa-location-dot"></i><div><strong>Venue</strong>'+esc(e.venue||'Islamic University, Kushtia')+'</div></div><div class="meta-row"><i class="fa-solid fa-circle-info"></i><div><strong>Status</strong>'+esc(status||'As scheduled')+'</div></div></div><div class="cta">'+(reg?'<a class="btn" href="'+esc(reg)+'" target="_blank" rel="noopener">Register for Event <i class="fa-solid fa-arrow-up-right-from-square"></i></a>':'')+(more?'<a class="btn secondary" href="'+esc(more)+'" target="_blank" rel="noopener">More Information <i class="fa-solid fa-arrow-up-right-from-square"></i></a>':'')+'<a class="btn secondary" href="events.html"><i class="fa-solid fa-arrow-left"></i> Back to All Events</a></div></section><section class="side-card" style="margin-top:20px"><h2>About IURS</h2><div class="venue-note">Islamic University Research Society promotes research, academic collaboration and learning opportunities at Islamic University, Kushtia.</div></section></aside></div>';root.className='';root.innerHTML=rootMarkup}).catch(err=>{root.className='';root.innerHTML='<section class="error"><h2>Unable to load this event</h2><p>'+esc(err.message||'Please try again shortly.')+'</p><a class="btn" href="events.html">Back to Events</a></section>'})})();
</script>
</body></html>
