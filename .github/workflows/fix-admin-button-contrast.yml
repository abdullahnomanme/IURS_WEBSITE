name: Fix admin button contrast

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message != 'fix(admin): restore button contrast'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch admin action button styles
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('public/admin.html')
          s = p.read_text(encoding='utf-8')
          marker = '/* admin-action-contrast-fix */'
          if marker not in s:
              old = '.mini .tier.hid{background:#fff4e0;color:#8a5000}</style>'
              new = '''.mini .tier.hid{background:#fff4e0;color:#8a5000}
          /* admin-action-contrast-fix */
          .mini .actions button,.mini .form-actions button{color:var(--text);background:#fff;border:1px solid #d7dbe2}
          .mini .actions button:hover,.mini .form-actions button:hover{color:var(--red);background:#fff;border-color:var(--red)}
          .mini .actions .btn,.mini .form-actions .btn{color:#fff;background:var(--red);border-color:var(--red)}
          .mini .actions .btn:hover,.mini .form-actions .btn:hover{color:#fff;background:var(--red2);border-color:var(--red2)}
          .mini .actions .btn.secondary,.mini .form-actions .btn.secondary{color:var(--red);background:#fff;border-color:var(--red)}
          .mini .actions .btn.secondary:hover,.mini .form-actions .btn.secondary:hover{color:#fff;background:var(--red);border-color:var(--red)}
          .mini .actions .btn.danger,.mini .form-actions .btn.danger{color:#fff;background:#8b1027;border-color:#8b1027}
          .mini .actions .btn.danger:hover,.mini .form-actions .btn.danger:hover{color:#fff;background:#6f0c20;border-color:#6f0c20}
          .mini .actions a{display:inline-flex;align-items:center;border:1px solid #d7dbe2;border-radius:7px;padding:7px 9px;font-size:11px;font-weight:700;color:var(--text);background:#fff;text-decoration:none}
          .mini .actions a:hover{color:var(--red);border-color:var(--red)}
          .mini button:focus-visible,.mini .actions a:focus-visible{outline:3px solid #d98aa0;outline-offset:2px}
          </style>'''
              if old not in s:
                  raise SystemExit('Expected admin.html style marker was not found')
              s = s.replace(old, new, 1)
              p.write_text(s, encoding='utf-8')
          PY

      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/admin.html
          git diff --cached --quiet && exit 0
          git commit -m "fix(admin): restore button contrast"
          git push
