name: Repair Worker source closure

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate and repair Worker as an ES module
        shell: python
        run: |
          from pathlib import Path
          import subprocess
          p = Path('src/index.js')
          s = p.read_text(encoding='utf-8')
          check_file = Path('/tmp/iurs-index-check.mjs')
          def check(text):
              check_file.write_text(text, encoding='utf-8')
              return subprocess.run(['node', '--check', str(check_file)], capture_output=True, text=True)
          current = check(s)
          if current.returncode == 0:
              print('Worker ES-module syntax is valid; no repair needed.')
          elif s.rstrip().endswith('};'):
              fixed = s.rstrip()[:-2] + '}\n'
              repaired = check(fixed)
              if repaired.returncode:
                  print(repaired.stderr)
                  raise SystemExit(repaired.returncode)
              p.write_text(fixed, encoding='utf-8')
              print('Removed the extra final object brace; Worker now parses as an ES module.')
          else:
              print(current.stderr)
              raise SystemExit(current.returncode)

      - name: Commit repaired source
        shell: bash
        run: |
          if git diff --quiet -- src/index.js; then
            echo "No repair required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/index.js
          git commit -m "fix: correct Worker ES module closure"
          git push origin HEAD:main
