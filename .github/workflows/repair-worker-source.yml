name: Repair Worker source closure

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Normalize the known Worker tail
        shell: python
        run: |
          from pathlib import Path
          import subprocess
          p = Path('src/index.js')
          s = p.read_text(encoding='utf-8')
          stripped = s.rstrip()
          if stripped.endswith('}\n};'):
              fixed = stripped[:-2] + '\n'
              p.write_text(fixed, encoding='utf-8')
              print('Removed the redundant final object brace from the Worker source.')
          else:
              print('Known bad tail not present; leaving source untouched.')
          check_file = Path('/tmp/iurs-index-check.mjs')
          check_file.write_text(p.read_text(encoding='utf-8'), encoding='utf-8')
          check = subprocess.run(['node', '--check', str(check_file)], capture_output=True, text=True)
          if check.returncode:
              print(check.stderr)
              raise SystemExit(check.returncode)
          print('Worker source passes ES-module syntax validation.')

      - name: Commit repaired source
        shell: bash
        run: |
          if git diff --quiet -- src/index.js; then
            echo "No repair required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/index.js
          git commit -m "fix: normalize Worker source tail"
          git push origin HEAD:main
