name: Repair Worker source closure

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore missing Worker module closure if needed
        id: repair
        shell: python
        run: |
          from pathlib import Path
          p = Path('src/index.js')
          s = p.read_text(encoding='utf-8')
          stripped = s.rstrip()
          if stripped.endswith('};'):
              print('Worker closure already present; no change needed.')
          else:
              p.write_text(stripped + '\n}\n};\n', encoding='utf-8')
              print('Restored the missing fetch-handler/object closure.')

      - name: Commit repaired source
        shell: bash
        run: |
          if git diff --quiet -- src/index.js; then
            echo "No repair required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/index.js
          git commit -m "fix: restore missing Worker module closure"
          git push origin HEAD:main
