name: Deploy IURS to Cloudflare

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

env:
  IURS_WORKER: iurs-website

jobs:
  verify-and-deploy:
    name: Verify and deploy production
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout production source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Normalize Worker source for verification and deployment
        shell: python
        run: |
          from pathlib import Path
          p = Path('src/index.js')
          s = p.read_text(encoding='utf-8')
          stripped = s.rstrip()
          if stripped.endswith('}\n};'):
              p.write_text(stripped[:-2] + '\n', encoding='utf-8')
              print('Normalized the known redundant Worker tail.')
          else:
              print('No Worker tail normalization required.')

      - name: Validate Worker source
        run: |
          cp src/index.js /tmp/iurs-index-check.mjs
          node --check /tmp/iurs-index-check.mjs
          echo "--- Worker source tail ---"
          tail -n 8 src/index.js
          echo "--- Git commit ---"
          git rev-parse HEAD

      - name: Run application tests
        run: |
          set -o pipefail
          npm test 2>&1 | tee test-output.log
          exit ${PIPESTATUS[0]}

      - name: Upload test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iurs-test-output-${{ github.run_id }}
          path: test-output.log
          if-no-files-found: ignore

      - name: Apply pending D1 migrations
        run: npm run db:migrate
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy Worker and static assets
        run: npm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Record deployed commit
        run: |
          echo "Production deployment completed."
          echo "Git commit: $GITHUB_SHA"
          echo "Worker: $IURS_WORKER"
          echo "Production URL: https://iurs.org.bd/"
