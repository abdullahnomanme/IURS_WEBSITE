name: Repair admin action contrast
on:
  push:
    branches:
      - main
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch admin action button contrast
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('public/admin.html')
          s = p.read_text(encoding='utf-8')
          marker = '/* admin-action-contrast-v2 */'
          if marker not in s:
              needle = '.mini .tier.hid{background:#fff4e0;color:#8a5000}'
              patch = '''.mini .tier.hid{background:#fff4e0;color:#8a5000}\n/* admin-action-contrast-v2 */\n.mini .actions button,.mini .form-actions button{color:var(--text);background:#fff;border:1px solid #d7dbe2}\n.mini .actions button:hover,.mini .form-actions button:hover{color:var(--red);background:#fff;border-color:var(--red)}\n.mini .actions .btn,.mini .form-actions .btn{color:#fff;background:var(--red);border-color:var(--red)}\n.mini .actions .btn:hover,.mini .form-actions .btn:hover{color:#fff;background:var(--red2);border-color:var(--red2)}\n.mini .actions .btn.secondary,.mini .form-actions .btn.secondary{color:var(--red);background:#fff;border-color:var(--red)}\n.mini .actions .btn.secondary:hover,.mini .form-actions .btn.secondary:hover{color:#fff;background:var(--red);border-color:var(--red)}\n.mini .actions .btn.danger,.mini .form-actions .btn.danger{color:#fff;background:#8b1027;border-color:#8b1027}\n.mini .actions .btn.danger:hover,.mini .form-actions .btn.danger:hover{color:#fff;background:#6f0c20;border-color:#6f0c20}\n.mini .actions a{display:inline-flex;align-items:center;border:1px solid #d7dbe2;border-radius:7px;padding:7px 9px;font-size:11px;font-weight:700;color:var(--text);background:#fff;text-decoration:none}\n.mini .actions a:hover{color:var(--red);border-color:var(--red)}\n.mini button:focus-visible,.mini .actions a:focus-visible{outline:3px solid #d98aa0;outline-offset:2px}'''
              if needle not in s:
                  raise SystemExit('Expected admin CSS anchor not found')
              s = s.replace(needle, patch, 1)
              p.write_text(s, encoding='utf-8')
          PY
      - name: Commit repair and remove workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/admin.html
          if ! git diff --cached --quiet; then
            git commit -m 'fix(admin): restore action button contrast'
            git push
          fi
          rm -f .github/workflows/repair-admin-contrast.yml
          git add .github/workflows/repair-admin-contrast.yml
          git diff --cached --quiet || (git commit -m 'chore: remove temporary contrast repair workflow' && git push)
