name: Repair Worker tail

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore missing Worker public API and export
        shell: python
        run: |
          from pathlib import Path
          p = Path('src/index.js')
          s = p.read_text(encoding='utf-8').rstrip()
          marker = "\nasync function publicApi(req,env,path){"
          if marker in s:
              print('Worker public API already present; no repair needed.')
              raise SystemExit(0)
          # The repository's known-good source was accidentally truncated immediately
          # after adminRoutes. Restore the exact continuation from the saved source.
          tail = r'''\n  return json({error:'Not found'},404)}

async function publicApi(req,env,path){
  if(path==='/api/public/recruitment')return json(publicRecruitment(await currentRecruitment(env)));
  if(path==='/api/public/setup-status'){const c=await env.DB.prepare('SELECT COUNT(*) c FROM users').first();return json({needsSetup:Number(c?.c||0)===0})}
  if(path==='/api/public/stats')return json(await publicStats(env));
  if(path==='/api/public/settings')return json(await getSiteSettings(env));
  if(path==='/api/public/homepage'&&req.method==='GET')return json(await getHomepage(env));
  if(path==='/api/public/publications'){const r=await env.DB.prepare("SELECT id,title,authors,category,type_label,journal,publication_year,doi,url,abstract,featured FROM publications WHERE published_status='published' ORDER BY sort_order,publication_year DESC,id DESC").all();const rows=r.results||[];return json({publications:rows,peerReviewed:rows.filter(x=>x.category==='peer_reviewed'),conference:rows.filter(x=>x.category==='conference'),workingPapers:rows.filter(x=>x.category==='working_paper'),underReview:rows.filter(x=>x.category==='under_review')})}
  if(path==='/api/public/events'){const r=await env.DB.prepare('SELECT * FROM events').all();return json(sortEvents(r.results||[]))}
  if(path==='/api/public/notices'){const t=todayStr();const r=await env.DB.prepare('SELECT * FROM notices WHERE published=1 ORDER BY pinned DESC,featured DESC,COALESCE(notice_date,date(created_at)) DESC,created_at DESC,id DESC').all();return json((r.results||[]).filter(n=>noticeActive(n,t)))}
  if(path==='/api/public/notices/archive'){const t=todayStr();const r=await env.DB.prepare('SELECT * FROM notices WHERE published=1 ORDER BY COALESCE(notice_date,date(created_at)) DESC,created_at DESC,id DESC').all();return json((r.results||[]).filter(n=>!noticeActive(n,t)))}
  if(path==='/api/public/gallery'){const r=await env.DB.prepare('SELECT id,category,title,caption,image_url,fit,featured FROM gallery_images WHERE published=1 ORDER BY sort_order,id').all();return json({gallery:r.results||[],categories:GALLERY_CATEGORIES})}
  if(path==='/api/public/training'){const r=await env.DB.prepare('SELECT id,title,trainer,description,date_label,image_url,link_url FROM training_sessions WHERE published=1 ORDER BY sort_order,id').all();return json({training:r.results||[]})}
  if(path==='/api/public/committee'){const sessions=(await env.DB.prepare('SELECT id,label,description,reference_note,is_current FROM committee_sessions ORDER BY is_current DESC,sort_order,label DESC').all()).results||[];const people=(await env.DB.prepare("SELECT id,session_id,name,designation,department,tier,photo_url,email,linkedin_url,facebook_url,sl_no FROM executives WHERE status='active' ORDER BY CASE tier WHEN 'advisor' THEN 0 WHEN 'leadership' THEN 1 WHEN 'roster' THEN 2 ELSE 3 END,sort_order,id").all()).results||[];const pack=s=>{const mine=t=>people.filter(p=>p.session_id===s.id&&p.tier===t);return {id:s.id,label:s.label,description:s.description,reference:s.reference_note,isCurrent:!!s.is_current,leadership:mine('leadership'),roster:people.filter(p=>p.session_id===s.id&&p.tier!=='leadership'&&p.tier!=='advisor'&&p.tier!=='member'),advisors:mine('advisor'),members:mine('member')}};const current=sessions.find(s=>s.is_current)||sessions[0]||null;return json({current:current?pack(current):null,archive:sessions.filter(s=>!current||s.id!==current.id).map(pack)})}
  if(path==='/api/public/alumni'){const r=await env.DB.prepare("SELECT id,name,session_label,department,graduation_year,occupation,organization,photo_url,bio,standing FROM alumni WHERE published=1 ORDER BY sort_order,id").all();const rows=r.results||[];return json({current:rows.filter(x=>x.standing!=='previous'),previous:rows.filter(x=>x.standing==='previous')})}
  if(path==='/api/public/blog'){const r=await env.DB.prepare("SELECT id,slug,title,author,category,excerpt,image_url,post_date FROM blog_posts WHERE status='published' ORDER BY sort_order,post_date DESC,id DESC").all();return json({posts:r.results||[]})}
  if(path.startsWith('/api/public/blog/')){const slug=decodeURIComponent(path.slice('/api/public/blog/'.length));const row=await env.DB.prepare("SELECT id,slug,title,author,category,excerpt,content,image_url,post_date FROM blog_posts WHERE slug=? AND status='published'").bind(cleanText(slug,160)).first();return row?json({post:row}):json({error:'Article not found.'},404)}
  if(path==='/api/public/join'&&req.method==='POST')return await submitApplication(req,env);
  if(path==='/api/public/chat'&&req.method==='POST')return await chat(req,env);
  return json({error:'Not found'},404)}

const CHAT_ABOUT='IURS is the Islamic University Research Society, an academic research organisation at Islamic University, Kushtia-7003, Bangladesh. Its motto is "Research can change the world". Office: TSCC, Islamic University, Kushtia-7003. Email: iuresearchsociety@gmail.com. Phone: +880 1749-022577. Office hours: Saturday to Thursday, 9:00 AM to 5:00 PM.';
const CHAT_LIMIT=20;
const CHAT_TOPICS='publications, events, training sessions, notices, the executive committee, alumni, blog articles, the photo gallery and how to join IURS';
const CHAT_STOP=new Set(['what','which','when','where','does','have','has','with','from','this','that','they','their','there','about','iurs','tell','please','know','would','could','many','much','your','yours','into','been','were','also','some','more','most','than','then','them','make','made','give','need','want','like','list','show','name','names','question','questions','society','university','islamic','current','currently','right','latest','recent','anything','everything','something']);
const chatTerms=q=>(String(q||'').toLowerCase().match(/[a-z0-9]{4,}/g)||[]).filter(w=>!CHAT_STOP.has(w)).slice(0,6);
const PUB_LABEL={peer_reviewed:'peer-reviewed article',conference:'conference/research paper',working_paper:'working paper',under_review:'under review'};
async function chatFacts(env,q){const out=[],terms=chatTerms(q);const want=t=>!q||new RegExp(t,'i').test(q);const add=(head,rows,fn)=>{if(rows&&rows.length)out.push(head+'\n'+rows.map(fn).join('\n'))};const grab=async(sql,...bind)=>{try{return ((await env.DB.prepare(sql).bind(...bind).all()).results)||[]}catch{return []}};const rank=(rows,...fields)=>{if(!terms.length)return rows;const score=r=>fields.map(f=>String(r[f]||'')).join(' ').toLowerCase();return rows.map((r,i)=>({r,i,s:terms.reduce((n,w)=>n+(score(r).includes(w)?1:0),0)})).sort((a,b)=>b.s-a.s||a.i-b.i).map(x=>x.r)};if(want('publication|paper|research|article|journal|doi|author|publish|study|studies')){const rows=rank(await grab("SELECT title,authors,category,journal,publication_year FROM publications WHERE published_status='published' ORDER BY publication_year DESC,id DESC LIMIT 12"),'title','authors','journal').slice(0,8);add('PUBLICATIONS:',rows,r=>`- "${r.title}" (${PUB_LABEL[r.category]||r.category}) by ${r.authors}. ${r.journal||''} ${r.publication_year||''}`.trim())}if(want('event|seminar|webinar|programme|program|conference|when|upcoming|past')){const rows=sortEvents(await grab('SELECT * FROM events')).slice(0,8);add('EVENTS:',rows,r=>`- ${r.title} — ${r.status}${r.event_date?', '+r.event_date:''}${r.event_time?', '+r.event_time:''}${r.venue?', at '+r.venue:''}`)}if(want('training|workshop|course|learn|skill')){const rows=await grab('SELECT title,trainer,date_label FROM training_sessions WHERE published=1 ORDER BY sort_order LIMIT 8');add('TRAINING SESSIONS:',rows,r=>`- ${r.title}${r.trainer?' — trainer '+r.trainer:''}${r.date_label?', '+r.date_label:''}`)}if(want('notice|announcement|news|deadline')){const t=todayStr();const rows=(await grab('SELECT title,body,expiry_date,published FROM notices WHERE published=1 ORDER BY created_at DESC LIMIT 12')).filter(n=>noticeActive(n,t)).slice(0,5);add('NOTICES:',rows,r=>`- ${r.title}: ${String(r.body||'').slice(0,240)}`)}if(want('committee|executive|president|secretary|leader|who is|treasurer|designation|vice|chair|adviser|advisor|moderator')){const rows=rank(await grab("SELECT e.name,e.designation,e.department,s.label FROM executives e JOIN committee_sessions s ON s.id=e.session_id WHERE s.is_current=1 AND e.status='active' ORDER BY CASE e.tier WHEN 'advisor' THEN 0 WHEN 'leadership' THEN 1 WHEN 'roster' THEN 2 ELSE 3 END,e.sort_order LIMIT 20"),'name','designation').slice(0,12);add('CURRENT EXECUTIVE COMMITTEE:',rows,r=>`- ${r.designation}: ${r.name}${r.department?' ('+r.department+')':''} [term ${r.label}]`)}if(want('alumni|graduate|former')){const rows=await grab('SELECT name,graduation_year,occupation,organization,standing FROM alumni WHERE published=1 ORDER BY sort_order LIMIT 10');add('ALUMNI:',rows,r=>`- ${r.name}${r.graduation_year?', '+r.graduation_year:''}${r.occupation?', '+r.occupation:''}${r.organization?' at '+r.organization:''} (${r.standing})`)}if(want('blog|article|post|write')){const rows=await grab("SELECT title,author,post_date,excerpt FROM blog_posts WHERE status='published' ORDER BY post_date DESC LIMIT 5");add('BLOG ARTICLES:',rows,r=>`- ${r.title}${r.author?' by '+r.author:''}${r.post_date?' ('+r.post_date+')':''}${r.excerpt?': '+String(r.excerpt).slice(0,160):''}`)}if(want('join|member|membership|apply|application|recruit|how do i|register|fee|payment|bkash|nagad')){const rs=publicRecruitment(await currentRecruitment(env));out.push('HOW TO JOIN:\n- '+(rs.open?'Member recruitment is OPEN right now. Apply through the Join IURS form at /join.html.':'Member recruitment is CLOSED right now, so the form at /join.html cannot be submitted.')+'\n- The form asks for name, student/IURS ID, department, session, year, email, phone, research interests, skills, previous research experience and reasons for joining.'+(rs.requirePayment&&rs.fee?`\n- There is a membership fee of ${rs.fee} ${rs.currency}, paid to ${rs.payTo} by ${rs.methods.join(', ')||'mobile banking'}. The transaction ID from the receipt must be entered on the form.`:'')+'\n- Every application stays pending until the executive team checks it and matches the transaction ID against the society payment record.')}if(want('gallery|photo|picture|image')){const c=await grab('SELECT COUNT(*) n FROM gallery_images WHERE published=1');add('GALLERY:',c,r=>`- ${r.n} photographs are published in the gallery at /gallery.html, grouped by category.`)}return out.join('\n\n')}
async function chat(req,env){if(!sameOrigin(req))return json({error:'Invalid origin'},403);const b=await body(req),q=cleanText(b.message,500);if(!q)return json({error:'Please type a question.'},400);const facts=await chatFacts(env,q);const fallback=facts?'Here is what the IURS website has on that:\n\n'+facts+'\n\nIf this does not answer your question, please email iuresearchsociety@gmail.com.':'I do not have that information on the IURS website. Please email iuresearchsociety@gmail.com and the team will help you.\n\nYou can ask me about '+CHAT_TOPICS+'.';if(!env.AI)return json({reply:fallback,grounded:true,model:'facts-only'});try{const r=await env.AI.run('@cf/meta/llama-3.1-8b-instruct',{max_tokens:320,temperature:0.1,messages:[{role:'system',content:'Answer ONLY using the supplied IURS facts. Never invent.'},{role:'user',content:q+'\n\nFACTS:\n'+facts}]});const reply=cleanText((r&&(r.response||r.result||''))||'',1500);return reply?json({reply,grounded:true,model:'workers-ai'}):json({reply:fallback,grounded:true,model:'facts-only'})}catch{return json({reply:fallback,grounded:true,model:'facts-only'})}}

export default {async fetch(request,env,ctx){const url=new URL(request.url);try{if(url.pathname.startsWith('/api/')){await ensureSchema(env);const user=await currentUser(request,env);if(request.method==='POST'&&url.pathname==='/api/auth/login')return await login(request,env);if(request.method==='POST'&&url.pathname==='/api/auth/logout')return await logout(request,env);if(request.method==='POST'&&url.pathname==='/api/auth/change-password')return await changePassword(request,env,user);if(request.method==='POST'&&url.pathname==='/api/setup/initial-admin')return await setup(request,env);if(request.method==='GET'&&url.pathname==='/api/auth/me')return json({authenticated:!!user,user});if(url.pathname.startsWith('/api/admin/')){if(user&&user.must_change_password)return json({error:'For security, please set a new password before managing content.',code:'must_change_password'},403);return await adminApi(request,env,user,url.pathname)}if(url.pathname.startsWith('/api/public/'))return await publicApi(request,env,url.pathname);if(url.pathname==='/api/health')return json({ok:true,service:'IURS full-stack backend'});return json({error:'Not found'},404)}if(url.pathname.startsWith('/uploads/')){if(request.method!=='GET'&&request.method!=='HEAD')return json({error:'Method not allowed'},405);let key;try{key=decodeURIComponent(url.pathname.slice(9))}catch{return new Response('Not found',{status:404})}if(!key||key.includes('..')||key.startsWith('/'))return new Response('Not found',{status:404});if(env.MEDIA){try{const obj=await env.MEDIA.get(key);if(obj){const uh=new Headers();obj.writeHttpMetadata(uh);uh.set('etag',obj.httpEtag);uh.set('Cache-Control','public, max-age=31536000, immutable');uh.set('X-Content-Type-Options','nosniff');return new Response(request.method==='HEAD'?null:obj.body,{headers:uh})}}catch(e){console.error('R2 get failed',e)}}let row=null;try{row=await env.DB.prepare('SELECT content_type,bytes,size FROM media_blobs WHERE key=?').bind(key).first()}catch(e){console.error('media_blobs get failed',e)}if(!row||!row.bytes)return new Response('Not found',{status:404});const raw=row.bytes;const body=raw instanceof Uint8Array?raw:raw instanceof ArrayBuffer?new Uint8Array(raw):new Uint8Array(Array.isArray(raw)?raw:[]);const etag='"'+key.replace(/[^\w.-]/g,'')+'-'+(row.size||body.length)+'"';const uh=new Headers({'content-type':row.content_type||'application/octet-stream','content-length':String(body.length),etag,'Cache-Control':'public, max-age=31536000, immutable','X-Content-Type-Options':'nosniff'});if((request.headers.get('if-none-match')||'')===etag)return new Response(null,{status:304,headers:uh});return new Response(request.method==='HEAD'?null:body,{headers:uh})}if(url.pathname==='/robots.txt')return new Response(`User-agent: *\nAllow: /\nDisallow: /admin.html\nDisallow: /dashboard.html\nDisallow: /login.html\nDisallow: /setup.html\nDisallow: /api/\n\nSitemap: ${url.origin}/sitemap.xml\n`,{headers:{'content-type':'text/plain; charset=utf-8','cache-control':'public, max-age=86400'}});const asset=await env.ASSETS.fetch(request);const h=new Headers(asset.headers);h.set('X-Content-Type-Options','nosniff');h.set('Referrer-Policy','strict-origin-when-cross-origin');h.set('X-Frame-Options','SAMEORIGIN');return new Response(asset.body,{status:asset.status,statusText:asset.statusText,headers:h})}catch(e){console.error(e);if(url.pathname.startsWith('/api/'))return json({error:'Server error. Please try again.'},500);try{return await env.ASSETS.fetch(request)}catch(e2){console.error(e2);return new Response('The website is temporarily unavailable. Please refresh in a moment.',{status:503,headers:{'content-type':'text/plain; charset=utf-8'}})}}}};
'''
          # a5f ends with the admin DELETE branch and an extra object closure.
          # Remove only the final two closure lines, then append the known-good tail.
          if s.endswith('}\n};'):
              s = s[:-4].rstrip()
          elif s.endswith('}'):
              s = s[:-1].rstrip()
          p.write_text(s + tail + '\n', encoding='utf-8')
          print('Worker public API/fetch export restored.')
      - name: Commit repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/index.js
          git commit -m "fix: restore Worker public API and fetch export" || exit 0
          git push origin HEAD:main
