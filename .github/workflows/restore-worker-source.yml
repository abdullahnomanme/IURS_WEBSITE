name: Restore known-good Worker source

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore Worker from known-good commit
        run: |
          git checkout a5f5bcf1214de440ceda73e7c951bb4da54b44e5 -- src/index.js
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/index.js
          if git diff --cached --quiet; then
            echo "Worker source already matches known-good version."
            exit 0
          fi
          git commit -m "fix: restore known-good Worker module closure"
          git push origin HEAD:main
