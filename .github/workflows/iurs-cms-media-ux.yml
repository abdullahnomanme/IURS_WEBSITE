name: Apply IURS recruitment media CMS patch

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: "!contains(github.event.head_commit.message, 'Apply IURS recruitment media CMS patch')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch source files
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def rep(path, old, new):
              p=Path(path); s=p.read_text(encoding='utf-8')
              if old not in s: raise SystemExit(f'missing anchor in {path}: {old[:120]!r}')
              p.write_text(s.replace(old,new,1),encoding='utf-8')

          # Backend schema/API
          rep('src/index.js',
            "CREATE TABLE IF NOT EXISTS recruitment_campaigns (id INTEGER PRIMARY KEY AUTOINCREMENT,title TEXT NOT NULL,code TEXT,open INTEGER NOT NULL DEFAULT 0,opens_on TEXT,closes_on TEXT,fee TEXT,currency TEXT DEFAULT 'BDT',fee_note TEXT,methods TEXT,pay_to TEXT,pay_to_label TEXT,require_payment INTEGER NOT NULL DEFAULT 1,open_message TEXT,closed_message TEXT,archived INTEGER NOT NULL DEFAULT 0,sort_order INTEGER NOT NULL DEFAULT 0,created_at TEXT NOT NULL DEFAULT CURRENT_TIMESTAMP,updated_at TEXT NOT NULL DEFAULT CURRENT_TIMESTAMP)",
            "CREATE TABLE IF NOT EXISTS recruitment_campaigns (id INTEGER PRIMARY KEY AUTOINCREMENT,title TEXT NOT NULL,code TEXT,open INTEGER NOT NULL DEFAULT 0,opens_on TEXT,closes_on TEXT,fee TEXT,currency TEXT DEFAULT 'BDT',fee_note TEXT,methods TEXT,pay_to TEXT,pay_to_label TEXT,require_payment INTEGER NOT NULL DEFAULT 1,open_message TEXT,closed_message TEXT,image_url TEXT,archived INTEGER NOT NULL DEFAULT 0,sort_order INTEGER NOT NULL DEFAULT 0,created_at TEXT NOT NULL DEFAULT CURRENT_TIMESTAMP,updated_at TEXT NOT NULL DEFAULT CURRENT_TIMESTAMP)")
          rep('src/index.js',
            "applications:[['payment_method','TEXT'],['transaction_id','TEXT'],['payment_amount','TEXT'],['payment_sender','TEXT'],['payment_date','TEXT'],[\"payment_status\",\"TEXT NOT NULL DEFAULT 'unverified'\"],['payment_note','TEXT'],['verified_at','TEXT'],['verified_by','TEXT'],['year_level','TEXT'],['campaign_id','INTEGER']]};",
            "applications:[['payment_method','TEXT'],['transaction_id','TEXT'],['payment_amount','TEXT'],['payment_sender','TEXT'],['payment_date','TEXT'],[\"payment_status\",\"TEXT NOT NULL DEFAULT 'unverified'\"],['payment_note','TEXT'],['verified_at','TEXT'],['verified_by','TEXT'],['year_level','TEXT'],['campaign_id','INTEGER']],recruitment_campaigns:[['image_url','TEXT']]};")
          rep('src/index.js', "requirePayment:!!c.require_payment,\n  campaignId:c.id,code:c.code||''", "requirePayment:!!c.require_payment,\n  imageUrl:c.image_url||'',\n  campaignId:c.id,code:c.code||''")
          rep('src/index.js', "methods:String(c.methods||'').split(',').map(x=>x.trim()).filter(Boolean),\n  payTo:c.pay_to||'',payToLabel:c.pay_to_label||''};", "methods:String(c.methods||'').split(',').map(x=>x.trim()).filter(Boolean),\n  payTo:c.pay_to||'',payToLabel:c.pay_to_label||'',imageUrl:c.image_url||''};")
          rep('src/index.js', "campaignId:s.campaignId||null,code:s.code||null,\n  fee:s.fee||'',", "campaignId:s.campaignId||null,code:s.code||null,imageUrl:s.imageUrl||'',\n  fee:s.fee||'',")
          rep('src/index.js', "campaignId:s.campaignId||null,code:s.code||null,\n  fee:s.fee||'',", "campaignId:s.campaignId||null,code:s.code||null,imageUrl:s.imageUrl||'',\n  fee:s.fee||'',")
          rep('src/index.js', "INSERT INTO recruitment_campaigns(title,code,open,opens_on,closes_on,fee,currency,fee_note,methods,pay_to,pay_to_label,require_payment,open_message,closed_message,sort_order) VALUES(?,?,?,?,?,?,?,?,?,?,?,?,?,?,?)", "INSERT INTO recruitment_campaigns(title,code,open,opens_on,closes_on,fee,currency,fee_note,methods,pay_to,pay_to_label,require_payment,open_message,closed_message,image_url,sort_order) VALUES(?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?)")
          rep('src/index.js', "cleanText(b.openMessage,600)||null,cleanText(b.closedMessage,600)||null,sortValue(b.sortOrder,(o&&o.n)||0)).run();", "cleanText(b.openMessage,600)||null,cleanText(b.closedMessage,600)||null,cleanUrl(b.imageUrl)||null,sortValue(b.sortOrder,(o&&o.n)||0)).run();")
          rep('src/index.js', "UPDATE recruitment_campaigns SET title=?,code=?,open=?,opens_on=?,closes_on=?,fee=?,currency=?,fee_note=?,methods=?,pay_to=?,pay_to_label=?,require_payment=?,open_message=?,closed_message=?,sort_order=?,updated_at=datetime('now') WHERE id=?", "UPDATE recruitment_campaigns SET title=?,code=?,open=?,opens_on=?,closes_on=?,fee=?,currency=?,fee_note=?,methods=?,pay_to=?,pay_to_label=?,require_payment=?,open_message=?,closed_message=?,image_url=?,sort_order=?,updated_at=datetime('now') WHERE id=?")
          rep('src/index.js', "cleanText(b.openMessage,600)||null,cleanText(b.closedMessage,600)||null,sortValue(b.sortOrder,prev.sort_order||0),id).run();", "cleanText(b.openMessage,600)||null,cleanText(b.closedMessage,600)||null,cleanUrl(b.imageUrl)||null,sortValue(b.sortOrder,prev.sort_order||0),id).run();")
          rep('src/index.js', "return {open,title:s.title,message:open?s.openMessage:s.closedMessage,opensOn:s.opensOn||null,closesOn:s.closesOn||null,\n  campaignId:s.campaignId||null,code:s.code||null,", "return {open,title:s.title,message:open?s.openMessage:s.closedMessage,opensOn:s.opensOn||null,closesOn:s.closesOn||null,\n  campaignId:s.campaignId||null,code:s.code||null,imageUrl:s.imageUrl||'',")

          # Admin styles and fields
          rep('public/admin.html', '@media(max-width:640px){.top{height:68px}.brand strong{font-size:16px}.brand small{font-size:10px}.wrap{padding:18px 14px 30px}.stats{grid-template-columns:1fr 1fr}.panel{padding:16px;border-radius:15px}.hero h1{font-size:28px}.form-actions{flex-wrap:wrap}.cards{grid-template-columns:1fr}.table{min-width:760px}}', '@media(max-width:640px){.top{height:68px}.brand strong{font-size:16px}.brand small{font-size:10px}.wrap{padding:18px 14px 30px}.stats{grid-template-columns:1fr 1fr}.panel{padding:16px;border-radius:15px}.hero h1{font-size:28px}.form-actions{flex-wrap:wrap}.cards{grid-template-columns:1fr}.table{min-width:760px}}\n.cms-media-field{grid-column:1/-1}.cms-media-box{display:grid;grid-template-columns:minmax(0,1fr) 96px;gap:14px;align-items:center}.cms-media-preview{width:96px;height:72px;object-fit:cover;border-radius:10px;border:1px solid var(--line);background:#f3f5f7}.campaign-card-media{width:100%;height:150px;object-fit:cover;border-radius:12px;margin:-2px 0 12px;background:#f4f6f8}.campaign-kicker{display:flex;gap:7px;align-items:center;flex-wrap:wrap;margin-bottom:7px}.campaign-kicker .pill{font-size:10px}.recruitment-media-preview{width:100%;max-height:220px;object-fit:cover;border-radius:12px;border:1px solid var(--line);background:#f4f6f8}\n')
          rep('public/admin.html', '<div class="field" style="grid-column:1/-1"><label>Campaign title</label><input id="cpt" required placeholder="e.g. Membership Drive 2026"></div>', '<div class="field" style="grid-column:1/-1"><label>Campaign title</label><input id="cpt" required placeholder="e.g. Membership Drive 2026"></div><div class="field cms-media-field"><label>Campaign banner / photo <small class="muted">(optional)</small></label><div class="cms-media-box"><div id="cpDrop" class="dropzone"><input type="file" id="cpFile" accept="image/jpeg,image/png,image/webp,image/gif,image/avif" hidden><div class="dz-inner"><b>Click to choose a campaign image</b><span class="muted">or drag an image here — it is resized automatically before upload</span></div><div id="cpProg" class="dz-prog" hidden><span></span></div></div><div><img id="cpPrev" class="cms-media-preview" alt="Campaign preview" hidden></div></div><div class="dz-row"><div style="flex:1"><label style="font-size:12px">Image path or link</label><input id="cpimg" placeholder="Filled in automatically after upload, or paste an external image URL"></div></div></div>')
          rep('public/admin.html', '<div class="field" style="grid-column:1/-1"><label>Heading shown on the Join page</label><input id="r_title" placeholder="Member Recruitment"></div>', '<div class="field" style="grid-column:1/-1"><label>Heading shown on the Join page</label><input id="r_title" placeholder="Member Recruitment"></div><div class="field cms-media-field"><label>Recruitment banner / photo <small class="muted">(optional)</small></label><div class="cms-media-box"><div id="rDrop" class="dropzone"><input type="file" id="rFile" accept="image/jpeg,image/png,image/webp,image/gif,image/avif" hidden><div class="dz-inner"><b>Click to choose a recruitment image</b><span class="muted">or drag an image here — it is resized automatically before upload</span></div><div id="rProg" class="dz-prog" hidden><span></span></div></div><div><img id="rPrev" class="cms-media-preview" alt="Recruitment preview" hidden></div></div><div class="dz-row"><div style="flex:1"><label style="font-size:12px">Image path or link</label><input id="r_img" placeholder="Filled in automatically after upload, or paste an external image URL"></div></div></div>')
          rep('public/admin.html', "function resetCp(){['cpId','cpt','cpcode','cpso','cpopens','cpcloses','cpfee','cpcurrency','cpfeenote','cpmethods','cppayto','cppaytolabel','cpopenmsg','cpclosedmsg'].forEach(x=>$(x).value='');", "function resetCp(){['cpId','cpt','cpcode','cpso','cpopens','cpcloses','cpfee','cpcurrency','cpfeenote','cpmethods','cppayto','cppaytolabel','cpopenmsg','cpclosedmsg','cpimg'].forEach(x=>$(x).value='');")
          old_render="function renderCp(){$('cpCards').innerHTML=cpList.map(c=>`<div class=\"mini\"><h3>${+c.archived?'🗄 ':''}${esc(c.title)}</h3><p><span class=\"pill ${c.live?'green':'red'}\">${+c.archived?'Archived':(c.live?'Live now':'Not live')}</span>${c.code?' · '+esc(c.code):''}${c.opens_on||c.closes_on?' · '+esc(c.opens_on||'start')+' → '+esc(c.closes_on||'open end'):''}</p><p>${+c.require_payment?('Fee '+esc(c.fee||'')+' '+esc(c.currency||'')):'No fee required'}</p><div class=\"form-actions\"><button class=\"btn small\" onclick=\"editCp(${c.id})\">Edit</button>${+c.archived?`<button class=\"btn small secondary\" onclick=\"archiveCp(${c.id},0)\">Restore</button>`:`<button class=\"btn small secondary\" onclick=\"archiveCp(${c.id},1)\">Archive</button>`}</div></div>`).join('')||'<p class=\"muted\">No campaigns yet — the legacy Recruitment window above is in charge until one is created.</p>'}"
          new_render="function renderCp(){$('cpCards').innerHTML=cpList.map(c=>`<div class=\"mini\">${c.image_url?`<img class=\"campaign-card-media\" src=\"${esc(c.image_url)}\" alt=\"\" loading=\"lazy\">`:''}<div class=\"campaign-kicker\"><span class=\"pill ${c.live?'green':'red'}\">${+c.archived?'Archived':(c.live?'Live now':'Not live')}</span>${c.code?`<span class=\"pill\">${esc(c.code)}</span>`:''}</div><h3>${esc(c.title)}</h3><p>${c.opens_on||c.closes_on?esc(c.opens_on||'start')+' → '+esc(c.closes_on||'open end'):''}</p><p>${+c.require_payment?('Fee '+esc(c.fee||'')+' '+esc(c.currency||'')):'No fee required'}</p><div class=\"form-actions\"><button class=\"btn small\" onclick=\"editCp(${c.id})\">Edit</button>${+c.archived?`<button class=\"btn small secondary\" onclick=\"archiveCp(${c.id},0)\">Restore</button>`:`<button class=\"btn small secondary\" onclick=\"archiveCp(${c.id},1)\">Archive</button>`}</div></div>`).join('')||'<p class=\"muted\">No campaigns yet — the legacy Recruitment window above is in charge until one is created.</p>'}"
          rep('public/admin.html', old_render, new_render)
          old_edit="window.editCp=id=>{const c=cpList.find(x=>x.id===id);if(!c)return;$('cpId').value=c.id;$('cpt').value=c.title;$('cpcode').value=c.code||'';$('cpso').value=c.sort_order??'';$('cpopen').checked=!!+c.open;$('cpreqpay').checked=!!+c.require_payment;$('cpopens').value=c.opens_on||'';$('cpcloses').value=c.closes_on||'';$('cpfee').value=c.fee||'';$('cpcurrency').value=c.currency||'';$('cpfeenote').value=c.fee_note||'';$('cpmethods').value=c.methods||'';$('cppayto').value=c.pay_to||'';$('cppaytolabel').value=c.pay_to_label||'';$('cpopenmsg').value=c.open_message||'';$('cpclosedmsg').value=c.closed_message||'';window.scrollTo({top:0,behavior:'smooth'})};"
          new_edit="window.editCp=id=>{const c=cpList.find(x=>x.id===id);if(!c)return;$('cpId').value=c.id;$('cpt').value=c.title;$('cpcode').value=c.code||'';$('cpso').value=c.sort_order??'';$('cpopen').checked=!!+c.open;$('cpreqpay').checked=!!+c.require_payment;$('cpopens').value=c.opens_on||'';$('cpcloses').value=c.closes_on||'';$('cpfee').value=c.fee||'';$('cpcurrency').value=c.currency||'';$('cpfeenote').value=c.fee_note||'';$('cpmethods').value=c.methods||'';$('cppayto').value=c.pay_to||'';$('cppaytolabel').value=c.pay_to_label||'';$('cpopenmsg').value=c.open_message||'';$('cpclosedmsg').value=c.closed_message||'';$('cpimg').value=c.image_url||'';$('cpPrev').src=c.image_url||'';$('cpPrev').hidden=!c.image_url;window.scrollTo({top:0,behavior:'smooth'})};"
          rep('public/admin.html', old_edit, new_edit)
          rep('public/admin.html', "openMessage:cpopenmsg.value,closedMessage:cpclosedmsg.value,sortOrder:cpso.value};", "openMessage:cpopenmsg.value,closedMessage:cpclosedmsg.value,imageUrl:cpimg.value,sortOrder:cpso.value};")
          rep('public/admin.html', "r_openmsg.value=s.openMessage||'';r_closedmsg.value=s.closedMessage||'';r_reqpay.checked=!!s.requirePayment;", "r_openmsg.value=s.openMessage||'';r_closedmsg.value=s.closedMessage||'';r_reqpay.checked=!!s.requirePayment;r_img.value=s.imageUrl||'';rPrev.src=s.imageUrl||'';rPrev.hidden=!s.imageUrl;")
          rep('public/admin.html', "payTo:r_payto.value,payToLabel:r_paytolabel.value})", "payTo:r_payto.value,payToLabel:r_paytolabel.value,imageUrl:r_img.value})")
          rep('public/admin.html', "attachUploader({drop:'trDrop',file:'trFile',target:'ti',prev:'trPrev',msg:'trMsg',prog:'trProg',noun:'training image',endpoint:'/api/admin/training/upload'});", "attachUploader({drop:'trDrop',file:'trFile',target:'ti',prev:'trPrev',msg:'trMsg',prog:'trProg',noun:'training image',endpoint:'/api/admin/training/upload'});attachUploader({drop:'cpDrop',file:'cpFile',target:'cpimg',prev:'cpPrev',msg:'cpMsg',prog:'cpProg',noun:'campaign image'});attachUploader({drop:'rDrop',file:'rFile',target:'r_img',prev:'rPrev',msg:'recMsg',prog:'rProg',noun:'recruitment image'});")

          # Public recruitment image
          rep('public/join.html', ".iu-window p{padding-left:4px;font-size:13.5px;line-height:1.75}.iu-window.open .iu-window-dot{box-shadow:0 0 0 5px rgba(21,112,63,.12)!important}", ".iu-window p{padding-left:4px;font-size:13.5px;line-height:1.75}.iu-window.open .iu-window-dot{box-shadow:0 0 0 5px rgba(21,112,63,.12)!important}.iu-window-media{margin:0 0 14px;border-radius:14px;overflow:hidden;border:1px solid var(--borderColor);background:#f4f6f8;box-shadow:0 8px 24px rgba(16,24,40,.06)}.iu-window-media img{display:block;width:100%;max-height:300px;object-fit:cover}.iu-window-media[hidden]{display:none}")
          rep('public/join.html', '<p id="j-window-msg"></p>\n</div>', '<p id="j-window-msg"></p><div class="iu-window-media" id="j-window-media" hidden><img id="j-window-image" alt="Recruitment campaign"></div>\n</div>')
          rep('public/assets/iurs-content.js', "      var state = document.getElementById('j-window-state');\n      if (state) state.textContent = (r.open ? 'Applications are open' : 'Applications are closed') +", "      var media = document.getElementById('j-window-media');\n      var mediaImg = document.getElementById('j-window-image');\n      var image = safeSrc(r.imageUrl);\n      if (media && mediaImg) { if (image) { mediaImg.src = image; mediaImg.alt = r.title ? r.title + ' recruitment campaign' : 'Recruitment campaign'; media.hidden = false; } else { mediaImg.removeAttribute('src'); media.hidden = true; } }\n      var state = document.getElementById('j-window-state');\n      if (state) state.textContent = (r.open ? 'Applications are open' : 'Applications are closed') +")

          for f in ['src/index.js','public/admin.html','public/join.html','public/assets/iurs-content.js']:
              if not Path(f).read_text(encoding='utf-8').strip(): raise SystemExit(f'{f} empty')
          PY
          npm test
      - name: Commit and remove patch workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/index.js public/admin.html public/join.html public/assets/iurs-content.js .github/workflows/iurs-cms-media-ux.yml
          git rm .github/workflows/iurs-cms-media-ux.yml
          git commit -m "Apply IURS recruitment media CMS patch"
          git push
